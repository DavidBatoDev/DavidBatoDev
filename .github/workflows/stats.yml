name: Update stats card
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    paths: ["scripts/build_stats.py"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/build_stats.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git diff --staged --quiet || git commit -m "Update stats card" && git push
